[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "little-tinker-rig"
version = "0.1.1"
description = "Structural Python editor with optional Pybricks robotics support"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-2.0"
license-files = ["LICENSE.txt", "examples/pybricks/LICENSE.txt", "examples/pybricks/community/licenses/*.txt", "lessons/pybricks/*/robot/CAreadme.txt"]
authors = [{ name = "Igor Lobanov", email = "lobanov.igor@gmail.com" }]
dependencies = ["platformdirs>=4,<5", "ruff>=0.14,<1"]

[project.optional-dependencies]
tui = [
    "textual>=8,<9",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26",
    "jedi>=0.20,<0.21",
    "pybricks>=4,<5",
]
qt = [
    "jedi>=0.20,<0.21",
    "pybricks>=4,<5",
    "PySide6>=6.8,<7",
    "moderngl>=5.12,<6",
    "numpy>=2,<3",
]
pybricks = ["pybricksdev>=2.3.2,<3", "pyserial>=3.5,<4"]
gamepad = ["pygame-ce>=2.5,<3"]

[project.urls]
Homepage = "https://github.com/alepoydes/little-tinker-rig"
Repository = "https://github.com/alepoydes/little-tinker-rig"
Issues = "https://github.com/alepoydes/little-tinker-rig/issues"

[project.scripts]
little-tinker-rig = "little_tinker_rig.cli.main:main"
little-tinker-rig-qt-console = "little_tinker_rig.qt.app:main"
little-tinker-rig-tui = "little_tinker_rig.tui.app:main"

[project.gui-scripts]
little-tinker-rig-qt = "little_tinker_rig.qt.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "black>=26.5,<27",
    "build>=1.2",
    "babel>=2.17,<3",
]

[tool.setuptools.packages.find]
include = ["little_tinker_rig*"]
namespaces = false

[tool.uv.sources]
pybricksdev = { git = "https://github.com/alepoydes/pybricksdev", rev = "973fe51b8960c3cac53ce56bed6129f0574c3919" }

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"

[tool.setuptools.package-data]
little_tinker_rig = ["snippets/**/*.py", "snippets/**/*.toml", "core/formatting.toml", "locale/languages.json", "locale/**/*.po", "locale/**/*.mo", "qt/icons/*.svg", "pybricks/installer.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Templates are parsed, not executed. String annotations define type/unit contracts;
# imports declare expansion dependencies, including names used by defaults.
# Defaults, assignments and empty loop bodies are intentional expansion patterns.
"little_tinker_rig/snippets/**/*.py" = ["F401", "F722", "F821", "F841", "B006", "B007", "B008", "UP037"]

[tool.black]
target-version = ["py311"]
